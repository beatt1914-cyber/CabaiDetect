spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cabaidetect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
  jackson:
    serialization:
      fail-on-empty-beans: false
  # Gmail SMTP — ganti username & password dengan akun kamu
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:cabaidetect-dev-secret-key-minimum-32-chars-ok}
    expiration: 86400000  # 24 jam

# Dataset path
dataset:
  base-path: ${DATASET_PATH:classpath:dataset}
